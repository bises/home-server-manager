name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read the Docker socket group ID
        run: |
          gid="$(stat -c '%g' /var/run/docker.sock)"
          printf 'HSM_DOCKER_GID=%s\n' "$gid" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...
      - name: Verify the Tailscale Compose override
        env:
          HSM_TAILSCALE_IP: "100.64.0.10"
          HSM_AUTH_FILE: /tmp/example-hsm-auth.json
        run: |
          docker compose -f docker-compose.yml -f docker-compose.tailscale.yml config --format json |
            jq -e '
              (.services.web.ports | map(.host_ip) | sort) == ["100.64.0.10", "127.0.0.1"] and
              .services.web.environment.HSM_AUTH_CONFIG == "/etc/home-server-manager/auth.json" and
              any(.services.web.volumes[]; .target == "/etc/home-server-manager/auth.json" and .read_only == true and .bind.create_host_path == false)
            ' >/dev/null
      - name: Validate the browser accounts Compose override
        env:
          HSM_AUTH_STATE_DIR: /tmp/example-hsm-accounts
          HSM_TLS_CERT_FILE: /tmp/example-hsm-tls/server.crt
          HSM_TLS_KEY_FILE: /tmp/example-hsm-tls/server.key
        run: docker compose -f docker-compose.yml -f docker-compose.accounts.yml config --quiet
      - name: Build and start the Compose services
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:8090/api/v1/snapshot |
              jq -e '.freshness == "fresh" and .docker_available == true and .read_only == true and .summary.total == 0' >/dev/null &&
              curl --silent --fail --max-time 5 http://127.0.0.1:8090/setup | grep -q 'Container setup'; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color
          exit 1
      - name: Stop the fixture
        if: always() && env.HSM_DOCKER_GID != ''
        run: docker compose down --volumes
