name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...
      - name: Build and start the Compose services
        run: |
          export HSM_DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          docker compose up -d --build
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:8090/api/v1/snapshot |
              jq -e '.freshness == "fresh" and .docker_available == true and .read_only == true' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color
          exit 1
      - name: Stop the fixture
        if: always()
        run: HSM_DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)" docker compose down --volumes
